<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WarDogs — Launch Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #0a0c08;
    --panel: #14170f;
    --panel-line: #2a3020;
    --olive: #4a5438;
    --olive-dim: #313823;
    --bone: #d9d3ba;
    --bone-dim: #8a8770;
    --alert: #c9401f;
    --alert-bright: #ff5a2e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 50% 20%, #1a1f13 0%, var(--void) 65%);
    font-family: 'JetBrains Mono', monospace;
    color: var(--bone);
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--panel-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--panel-line) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.18;
    pointer-events: none;
  }

  .sweep {
    position: fixed;
    inset: -50%;
    background: conic-gradient(from 0deg, transparent 0deg, rgba(74,84,56,0.14) 8deg, transparent 20deg);
    animation: rotate 6s linear infinite;
    pointer-events: none;
  }
  @keyframes rotate { to { transform: rotate(360deg); } }

  .dossier {
    position: relative;
    z-index: 1;
    width: min(560px, 100%);
    background: linear-gradient(180deg, var(--panel), #101309);
    border: 1px solid var(--olive-dim);
    padding: 38px 34px 30px;
  }

  .bracket {
    position: absolute;
    width: 22px;
    height: 22px;
    border: 2px solid var(--alert);
  }
  .bracket.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .bracket.tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
  .bracket.bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
  .bracket.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .callsign-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--bone-dim);
    border-bottom: 1px solid var(--panel-line);
    padding-bottom: 14px;
    margin-bottom: 26px;
  }
  .status-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--alert-bright);
    margin-right: 7px;
    box-shadow: 0 0 8px var(--alert-bright);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .designation {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(40px, 9vw, 64px);
    letter-spacing: 0.02em;
    line-height: 0.95;
    color: var(--bone);
    text-transform: uppercase;
    margin: 0;
  }
  .designation span { color: var(--alert-bright); }

  .subline {
    font-size: 12px;
    color: var(--bone-dim);
    letter-spacing: 0.06em;
    margin-top: 10px;
    margin-bottom: 32px;
  }

  .clock {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .unit {
    position: relative;
    background: var(--void);
    border: 1px solid var(--olive-dim);
    padding: 16px 8px 12px;
    text-align: center;
  }
  .unit::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--olive);
  }
  .num {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: clamp(32px, 8vw, 46px);
    font-variant-numeric: tabular-nums;
    color: var(--bone);
    line-height: 1;
  }
  .unit-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--bone-dim);
    margin-top: 8px;
  }

  .target-line {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid var(--panel-line);
    font-size: 11px;
    color: var(--bone-dim);
    letter-spacing: 0.04em;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
  }
  .target-line b { color: var(--olive); font-weight: 500; }

  .done {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 7vw, 40px);
    color: var(--alert-bright);
    text-transform: uppercase;
    text-align: center;
    padding: 20px 0;
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>
  <div class="sweep"></div>

  <div class="dossier">
    <div class="bracket tl"></div>
    <div class="bracket tr"></div>
    <div class="bracket bl"></div>
    <div class="bracket br"></div>

    <div class="callsign-row">
      <span><span class="status-dot"></span>OPERATION ACTIVE</span>
      <span>SECTOR: DE</span>
    </div>

    <h1 class="designation">WAR<span>DOGS</span></h1>
    <div class="subline">LAUNCH SEQUENCE — TIME TO DEPLOYMENT</div>

    <div id="clockArea" class="clock"></div>

    <div class="target-line">
      <span>H-HOUR: <b id="targetTime"></b></span>
      <span>ZONE: <b>EUROPE/BERLIN</b></span>
    </div>
  </div>

<script>
  // Fixed target: 2026-09-10 18:00 Europe/Berlin (CEST, UTC+2). Locked to this
  // specific date — does not shift to "today" on future visits.
  const target = new Date('2026-09-10T18:00:00+02:00');
  document.getElementById('targetTime').textContent =
    target.toLocaleString('en-GB', { timeZone: 'Europe/Berlin', hour: '2-digit', minute: '2-digit' }) + ' CET/CEST';

  const clockArea = document.getElementById('clockArea');

  function render() {
    const now = new Date();
    const diff = target - now;

    if (diff <= 0) {
      clockArea.innerHTML = '<div class="done">WarDogs Deployed</div>';
      return;
    }

    const totalSeconds = Math.floor(diff / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    clockArea.innerHTML = `
      <div class="unit"><div class="num">${String(hours).padStart(2,'0')}</div><div class="unit-label">HOURS</div></div>
      <div class="unit"><div class="num">${String(minutes).padStart(2,'0')}</div><div class="unit-label">MINUTES</div></div>
      <div class="unit"><div class="num">${String(seconds).padStart(2,'0')}</div><div class="unit-label">SECONDS</div></div>
    `;
  }

  render();
  setInterval(render, 1000);
</script>
</body>
</html>
